<style>
:root{--bg:#080b16;--surface:#101629;--surface2:#151d36;--surface3:#0d1325;--text:#f5f7ff;--muted:#aab4cb;--line:#263250;--accent:#6fffe9;--accent2:#8b7cff;--accent3:#ff67c7;--gold:#ffd166;--good:#5ee7a9;--bad:#ff718d;--shadow:0 18px 55px rgba(0,0,0,.34)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 8% 0,rgba(111,255,233,.11),transparent 22%),radial-gradient(circle at 92% 4%,rgba(255,103,199,.09),transparent 24%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}.wrap{width:min(1280px,calc(100% - 32px));margin:0 auto}.top{position:sticky;top:0;z-index:50;background:rgba(8,11,22,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}nav{min-height:68px;display:flex;align-items:center;gap:16px;justify-content:space-between}.brand{font-weight:900;letter-spacing:.02em}.brand strong{background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}.nav{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:flex-end}.nav a{padding:9px 12px;border-radius:12px;color:#cdd6ed;border:1px solid transparent}.nav a:hover,.nav a.active{background:rgba(255,255,255,.045);border-color:var(--line)}.hero{padding:32px 0 20px}.hero-card{padding:42px;border:1px solid rgba(111,255,233,.18);border-radius:30px;background:linear-gradient(145deg,rgba(18,26,52,.96),rgba(13,18,35,.92));box-shadow:var(--shadow);position:relative;overflow:hidden}.hero-card:before,.hero-card:after{content:"";position:absolute;filter:blur(35px);border-radius:50%;pointer-events:none}.hero-card:before{width:260px;height:260px;right:-80px;top:-110px;background:rgba(139,124,255,.22)}.hero-card:after{width:240px;height:240px;left:-100px;bottom:-110px;background:rgba(111,255,233,.12)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(38px,6vw,72px);line-height:1.04;margin:10px 0 14px}.gradient{background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:900px;color:var(--muted);line-height:1.75;font-size:17px;position:relative}.actions,.row,.toolbar,.chips{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer;transition:.16s ease}.btn:hover{transform:translateY(-1px);border-color:#3b4b72}.btn.primary{border-color:rgba(111,255,233,.36);background:linear-gradient(135deg,rgba(111,255,233,.14),rgba(139,124,255,.13));box-shadow:0 0 26px rgba(111,255,233,.06)}.btn.gold{border-color:rgba(255,209,102,.34);background:linear-gradient(135deg,rgba(255,209,102,.15),rgba(255,103,199,.08))}.btn.danger{border-color:rgba(255,113,141,.32);background:rgba(255,113,141,.08)}.btn.ghost{background:transparent}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px 0}.stat,.panel,.tool,.cat-card{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:18px}.stat{padding:17px}.stat b{display:block;font-size:25px}.stat span,.meta,.muted{color:var(--muted)}.section{padding:24px 0}.head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.head h2{font-size:28px;margin:6px 0 0}.search{min-width:320px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.search input{width:100%;padding:11px 0;background:transparent;border:0;outline:0;color:var(--text)}.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.cat-card{padding:18px;transition:.16s ease}.cat-card:hover{transform:translateY(-2px);border-color:rgba(111,255,233,.3);box-shadow:0 16px 35px rgba(0,0,0,.22)}.cat-card b{display:block;font-size:18px;margin-bottom:8px}.cat-card span{color:var(--muted);font-size:13px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tool{padding:17px;display:flex;flex-direction:column;min-height:205px;transition:.16s ease}.tool:hover{transform:translateY(-2px);border-color:rgba(111,255,233,.26);box-shadow:0 14px 32px rgba(0,0,0,.22)}.tool .icon{font-size:28px}.tool h3{font-size:18px;margin:10px 0 7px}.tool p{color:var(--muted);line-height:1.55;font-size:13px;flex:1}.workspace{padding:28px 0 70px}.ws-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}.ws-head h1{font-size:40px;margin:8px 0}.desc{color:var(--muted);line-height:1.7;max-width:880px}.panel{padding:22px;box-shadow:var(--shadow)}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800;color:#ced8ec}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#091022;color:var(--text);outline:0}.field textarea{min-height:170px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(111,255,233,.5);box-shadow:0 0 0 3px rgba(111,255,233,.08)}.result{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#081022;min-height:70px}.result.ok{border-color:rgba(94,231,169,.35)}.result.err{border-color:rgba(255,113,141,.4)}.result.hidden{display:none}.result pre{margin:0;white-space:pre-wrap;overflow:auto;word-break:break-word}.preview{max-width:100%;max-height:460px;border-radius:14px;margin-top:12px;display:block}.notice{padding:13px;border-radius:12px;background:rgba(255,209,102,.09);border:1px solid rgba(255,209,102,.22);color:#ffe7a4}.task{border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:12px;background:rgba(255,255,255,.02)}.task.overdue{border-color:rgba(255,113,141,.38)}.task.done{opacity:.72}.task-top{display:flex;justify-content:space-between;gap:12px}.task-title{font-weight:900}.small{font-size:12px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.links a,.links button{padding:8px 10px;border:1px solid rgba(111,255,233,.16);background:rgba(111,255,233,.06);border-radius:10px;font-size:13px;color:var(--text);cursor:pointer}.badge{padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line)}.badge.overdue{color:#ffc0ca;border-color:rgba(255,113,141,.35);background:rgba(255,113,141,.08)}.badge.upcoming{color:#b9f9e1;border-color:rgba(94,231,169,.3);background:rgba(94,231,169,.08)}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:100}.modal{width:min(480px,calc(100vw - 26px));background:#0d1428;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.5);text-align:center}.stars{display:flex;justify-content:center;gap:4px;margin:16px 0}.star{background:transparent;border:0;color:#465270;font-size:35px;cursor:pointer}.star.active{color:var(--gold);text-shadow:0 0 16px rgba(255,209,102,.35)}.toast{position:fixed;right:16px;bottom:16px;z-index:150;max-width:380px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0d1428;box-shadow:var(--shadow)}footer{padding:35px 0 55px;text-align:center;color:var(--muted);font-size:13px}.hide{display:none!important}@media(max-width:980px){.cat-grid{grid-template-columns:repeat(3,1fr)}.tools{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.wrap{width:min(100% - 20px,1280px)}.nav{display:none}.hero-card{padding:26px}.cat-grid,.tools,.stats{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.head,.ws-head{flex-direction:column;align-items:stretch}.search{min-width:0}.ws-head h1{font-size:32px}}
</style>

<header class="top"><div class="wrap"><nav><a class="brand" href="#home">Smart <strong>Tools Hub</strong></a><div class="nav"><a data-nav="home" href="#home">Home</a><a data-nav="PDF" href="#cat:PDF">PDF</a><a data-nav="Image" href="#cat:Image">Images</a><a data-nav="Write" href="#cat:Write">Writing</a><a data-nav="File" href="#cat:File">Files</a><a data-nav="Other" href="#cat:Other">Utilities</a><a data-nav="reminder" href="#reminder">30-Day Reminder</a></div></nav></div></header>

<script>
'use strict';

const CATALOG=[
['create-pdf','Create PDF from Text','PDF'],['images-to-pdf','Images to PDF','PDF'],
['resize-image','Resize Image','Image'],['compress-image','Compress Image','Image'],['crop-image','Crop Image','Image'],['rotate-image','Rotate Image','Image'],['flip-image','Flip Image','Image'],['grayscale-image','Grayscale Image','Image'],['sepia-image','Sepia Image','Image'],['invert-image','Invert Image','Image'],['pixelate-image','Pixelate Image','Image'],['add-border-to-image','Add Border to Image','Image'],['add-text-to-image','Add Text to Image','Image'],['round-image','Round Image','Image'],['jpg-to-png','JPG to PNG','Image'],['png-to-jpg','PNG to JPG','Image'],['webp-to-png','WEBP to PNG','Image'],['png-to-webp','PNG to WEBP','Image'],['jpg-to-webp','JPG to WEBP','Image'],['webp-to-jpg','WEBP to JPG','Image'],['combine-images','Combine Images','Image'],['collage-maker','Collage Maker','Image'],['chart-maker','Chart Maker','Image'],
['word-counter','Word Counter','Write'],['character-counter','Character Counter','Write'],['uppercase','UPPERCASE Converter','Write'],['lowercase','lowercase Converter','Write'],['title-case','Title Case Converter','Write'],['sentence-case','Sentence Case Converter','Write'],['clean-whitespace','Clean Whitespace','Write'],['remove-duplicate-lines','Remove Duplicate Lines','Write'],['sort-lines','Sort Lines','Write'],['find-replace','Find & Replace','Write'],['slug-generator','Slug Generator','Write'],['content-summarizer','Simple Summarizer','Write'],['content-shortener','Content Shortener','Write'],['article-outline','Article Outline','Write'],['essay-outline','Essay Outline','Write'],['business-name-generator','Business Name Generator','Write'],['blog-post-ideas','Blog Post Ideas','Write'],['lorem-ipsum-generator','Lorem Ipsum Generator','Write'],
['csv-to-json','CSV to JSON','File'],['json-to-csv','JSON to CSV','File'],['json-to-xml','JSON to XML','File'],['xml-to-json','XML to JSON','File'],['split-csv','Split CSV','File'],['format-json','Format JSON','File'],['base64-encode','Base64 Encode','File'],['base64-decode','Base64 Decode','File'],['url-encode','URL Encode','File'],['url-decode','URL Decode','File'],['create-text-file','Create Text File','File'],
['epoch-converter','Epoch Converter','Other'],['password-generator','Password Generator','Other'],['meme-maker','Meme Maker','Other'],['gradient-generator','Gradient Generator','Other']
];
const TOOLS=CATALOG.map(([id,name,cat])=>({id,name,cat}));
const BY_ID=Object.fromEntries(TOOLS.map(t=>[t.id,t]));
const ICON={PDF:'📄',Image:'🖼️',Write:'✍️',File:'🗂️',Other:'🧰'};
const CATS=['PDF','Image','Write','File','Other'];
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=v=>String(v??'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',3200)}
function setResult(html,type='ok'){const o=$('#out');if(!o)return;o.className='result '+type;o.innerHTML=html}
function fail(e){setResult('<pre>'+esc(e?.message||String(e))+'</pre>','err')}
function need(id){const e=document.getElementById(id);if(!e)throw new Error('Required control is missing.');return e}
function needFile(id='files',idx=0){const f=need(id).files[idx];if(!f)throw new Error('Please choose a file.');return f}
function needFiles(id='files'){const fs=[...need(id).files];if(!fs.length)throw new Error('Please choose at least one file.');return fs}
function downloadBlob(blob,name){return new Promise(resolve=>{const root=$('#modalRoot');root.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="eyebrow">Save output</div><h2>Rate this tool</h2><p class="muted">Select a rating before downloading <b>'+esc(name)+'</b>.</p><div class="stars">'+[1,2,3,4,5].map(n=>'<button class="star" data-star="'+n+'">★</button>').join('')+'</div><div class="toolbar" style="justify-content:center"><button class="btn ghost" id="cancelDl">Cancel</button><button class="btn gold" id="saveDl" disabled>Save file</button></div></div></div>';let rating=0;root.querySelectorAll('.star').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.star);root.querySelectorAll('.star').forEach(s=>s.classList.toggle('active',Number(s.dataset.star)<=rating));need('saveDl').disabled=false});need('cancelDl').onclick=()=>{root.innerHTML='';resolve(false)};need('saveDl').onclick=()=>{if(!rating)return;const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1200);root.innerHTML='';resolve(true)}})}
function offer(blob,name,message,preview){const key='dl_'+crypto.getRandomValues(new Uint32Array(1))[0];setResult('<div>'+esc(message||'Ready.')+'</div>'+(preview||'')+'<div class="toolbar" style="margin-top:12px"><button class="btn primary" id="'+key+'">Download '+esc(name)+'</button></div>','ok');need(key).onclick=()=>downloadBlob(blob,name)}
function downloadText(text,name,mime='text/plain'){return downloadBlob(new Blob([String(text)],{type:mime}),name)}
function blobCanvas(c,type='image/png',quality=.92){return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('Browser could not encode the image.')),type,quality))}
function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('The selected image could not be decoded.'))};img.src=url})}
function canvasFor(img,w=img.naturalWidth||img.width,h=img.naturalHeight||img.height){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));const ctx=c.getContext('2d');if(!ctx)throw new Error('Canvas is unavailable.');return [c,ctx]}
function description(t){switch(t.cat){case'PDF':return'Create and process PDF output locally in the browser.';case'Image':return'Canvas-based image processing performed in your browser.';case'Write':return'Local text utility with immediate results.';case'File':return'Local data conversion or encoding utility.';default:return'Fast browser utility with no account required.'}}
function card(t){return '<article class="tool"><div class="icon">'+ICON[t.cat]+'</div><h3>'+esc(t.name)+'</h3><p>'+esc(description(t))+'</p><div class="row"><span class="meta">'+esc(t.cat)+'</span><span style="flex:1"></span><a class="btn primary" href="#tool:'+encodeURIComponent(t.id)+'">Open</a></div></article>'}
function home(){return '<section class="hero"><div class="hero-card"><div class="eyebrow">'+TOOLS.length+' tools · browser-first</div><h1>Smart tools for <span class="gradient">everyday work.</span></h1><p>Open a genre, pick a tool, and work inside a focused workspace. The interface is optimized for quick local tasks on desktop and mobile.</p><div class="actions"><a class="btn primary" href="#cat:PDF">PDF Tools</a><a class="btn" href="#cat:Image">Image Tools</a><a class="btn" href="#cat:Write">Writing Tools</a><a class="btn" href="#cat:File">File Tools</a><a class="btn gold" href="#reminder">30-Day Reminder</a></div></div></section><section class="stats"><div class="stat"><b>'+TOOLS.length+'</b><span>tools in catalog</span></div><div class="stat"><b>'+CATS.length+'</b><span>tool genres</span></div><div class="stat"><b>12</b><span>reminder task limit</span></div><div class="stat"><b>30</b><span>day reminder window</span></div></section><section class="section"><div class="head"><div><div class="eyebrow">Browse by genre</div><h2>Choose a workspace</h2></div></div><div class="cat-grid">'+CATS.map(c=>'<a class="cat-card" href="#cat:'+encodeURIComponent(c)+'"><b>'+ICON[c]+' '+c+'</b><span>'+TOOLS.filter(t=>t.cat===c).length+' tools</span></a>').join('')+'</div></section><section class="section"><div class="head"><div><div class="eyebrow">Full catalog</div><h2>All tools</h2></div><label class="search">⌕ <input id="homeSearch" placeholder="Search tools..."></label></div><div class="tools" id="homeTools">'+TOOLS.map(card).join('')+'</div></section>'}
function category(cat){const list=TOOLS.filter(t=>t.cat===cat);return '<section class="section"><div class="head"><div><div class="eyebrow">Genre workspace</div><h2>'+ICON[cat]+' '+esc(cat)+' tools</h2></div><label class="search">⌕ <input id="catSearch" placeholder="Search '+esc(cat)+' tools..."></label></div><div class="tools" id="catTools">'+list.map(card).join('')+'</div></section>'}
function inputFile(multiple=false,accept=''){return '<div class="field full"><label>Select file'+(multiple?'s':'')+'</label><input id="files" type="file" '+(multiple?'multiple ':'')+(accept?'accept="'+esc(accept)+'"':'')+'></div>'}
function textArea(label='Text',id='text',ph='Enter text...',rows=12){return '<div class="field full"><label>'+esc(label)+'</label><textarea id="'+id+'" rows="'+rows+'" placeholder="'+esc(ph)+'"></textarea></div>'}
function inputsFor(t){const id=t.id;if(t.cat==='PDF'){if(id==='create-pdf')return textArea('Text','text','Type content for the PDF...',18);return inputFile(true,'image/*')}
if(t.cat==='Image'){
 if(id==='combine-images'||id==='collage-maker')return inputFile(true,'image/*')+'<div class="field"><label>Columns</label><input id="cols" type="number" min="1" max="8" value="2"></div>';
 if(id==='chart-maker')return textArea('Chart data','text','Apples,20\nOranges,35\nBananas,15',10);
 let s=inputFile(false,'image/*');
 if(id==='resize-image')s+='<div class="field"><label>Width</label><input id="w" type="number" min="1" value="1200"></div><div class="field"><label>Height</label><input id="h" type="number" min="1" value="800"></div>';
 if(id==='compress-image')s+='<div class="field"><label>JPEG quality</label><input id="quality" type="number" min="0.1" max="1" step="0.05" value="0.7"></div>';
 if(id==='crop-image')s+='<div class="field"><label>X</label><input id="x" type="number" min="0" value="0"></div><div class="field"><label>Y</label><input id="y" type="number" min="0" value="0"></div><div class="field"><label>Width</label><input id="w" type="number" min="1" value="500"></div><div class="field"><label>Height</label><input id="h" type="number" min="1" value="500"></div>';
 if(id==='rotate-image')s+='<div class="field"><label>Degrees</label><select id="deg"><option value="90">90</option><option value="180">180</option><option value="270">270</option></select></div>';
 if(id==='flip-image')s+='<div class="field"><label>Direction</label><select id="dir"><option value="x">Horizontal</option><option value="y">Vertical</option><option value="xy">Both</option></select></div>';
 if(id==='pixelate-image')s+='<div class="field"><label>Pixel size</label><input id="size" type="number" min="2" max="80" value="12"></div>';
 if(id==='add-border-to-image')s+='<div class="field"><label>Border width</label><input id="border" type="number" min="1" max="200" value="20"></div><div class="field"><label>Border color</label><input id="color" type="color" value="#ffffff"></div>';
 if(id==='add-text-to-image')s+='<div class="field"><label>Text</label><input id="label" value="Smart Tools Hub"></div><div class="field"><label>Text size</label><input id="font" type="number" min="8" max="240" value="48"></div>';
 return s}
 if(t.cat==='Write'){let s=textArea('Text','text','Enter text here...');if(id==='find-replace')s+='<div class="field"><label>Find</label><input id="find"></div><div class="field"><label>Replace with</label><input id="replace"></div>';if(id==='lorem-ipsum-generator')s='<div class="field"><label>Paragraphs</label><input id="count" type="number" min="1" max="20" value="3"></div>';return s}
 if(t.cat==='File'){if(id==='csv-to-json'||id==='json-to-csv'||id==='json-to-xml'||id==='xml-to-json')return inputFile(false,'.csv,.json,.xml,text/csv,application/json,application/xml')+textArea('Or paste data','text','Paste data here...',10);if(id==='split-csv')return inputFile(false,'.csv,text/csv')+textArea('Or paste CSV','text','a,b\n1,2\n3,4',10)+'<div class="field"><label>Rows per part</label><input id="chunk" type="number" min="1" value="100"></div>';if(id==='format-json')return textArea('JSON','text','{"name":"value"}',14);if(id==='base64-encode'||id==='base64-decode'||id==='url-encode'||id==='url-decode'||id==='create-text-file')return textArea('Text','text','Enter text...',14)}

function pdfEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/\r?\n/g,' ')}
function asciiBytes(s){const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a}
function concatBytes(parts){const total=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(total);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}

function jpegPdf(items){const objs=[''];const kids=[];const font=0;items.forEach((it,idx)=>{const bin=atob(it.data.split(',')[1]),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const head=asciiBytes('<< /Type /XObject /Subtype /Image /Width '+it.w+' /Height '+it.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');const img=objs.length;objs.push(concatBytes([head,bytes,asciiBytes('\nendstream')]));const stream='q 595 0 0 842 0 0 cm /Im'+idx+' Do Q';const cid=objs.push('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');kids.push(objs.push('<< /Type /Page /Parent 1 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im'+idx+' '+img+' 0 R >> >> /Contents '+cid+' 0 R >>'))});objs[0]='<< /Type /Pages /Kids ['+kids.map(i=>i+' 0 R').join(' ')+'] /Count '+kids.length+' >>';const root=objs.push('<< /Type /Catalog /Pages 1 0 R >>');let parts=[asciiBytes('%PDF-1.4\n')],off=[0],total=parts[0].length;for(let i=0;i<objs.length;i++){off[i+1]=total;const b=objs[i] instanceof Uint8Array?objs[i]:asciiBytes(objs[i]);const h=asciiBytes((i+1)+' 0 obj\n'),f=asciiBytes('\nendobj\n');parts.push(h,b,f);total+=h.length+b.length+f.length}const xoff=total;let x='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<off.length;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';x+='trailer\n<< /Size '+(objs.length+1)+' /Root '+root+' 0 R >>\nstartxref\n'+xoff+'\n%%EOF';parts.push(asciiBytes(x));return new Blob([concatBytes(parts)],{type:'application/pdf'})}

if(id==='add-border-to-image'){const b=Math.max(1,Number(need('border').value)||20),color=need('color').value;const out=document.createElement('canvas');out.width=c.width+b*2;out.height=c.height+b*2;const o=out.getContext('2d');o.fillStyle=color;o.fillRect(0,0,out.width,out.height);o.drawImage(c,b,b);return[out,type,'bordered.png']}

const img=await loadImage(needFile()),ret=transformImage(id,img),quality=ret[3]??.92,blob=await blobCanvas(ret[0],ret[1],quality),url=URL.createObjectURL(blob);offer(blob,ret[2],'Image processed successfully.','<img class="preview" src="'+esc(url)+'" alt="Processed image preview">');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){fail(e)}}

function titleCase(s){return s.toLowerCase().replace(/\b[\p{L}\p{N}]/gu,m=>m.toUpperCase())}
function sentenceCase(s){return s.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase())}
function simpleSummary(s){const parts=s.match(/[^.!?]+[.!?]+/g)||[s];return parts.filter(Boolean).slice(0,3).join(' ').trim()}
function runWrite(t){try{const id=t.id,input=need('text').value;let out='';if(id==='word-counter'){const words=input.trim()?input.trim().split(/\s+/).length:0;out='Words: '+words}else if(id==='character-counter')out='Characters: '+input.length+'\nCharacters without spaces: '+input.replace(/\s/g,'').length;else if(id==='uppercase')out=input.toUpperCase();else if(id==='lowercase')out=input.toLowerCase();else if(id==='title-case')out=titleCase(input);else if(id==='sentence-case')out=sentenceCase(input);else if(id==='clean-whitespace')out=input.replace(/\s+/g,' ').trim();else if(id==='remove-duplicate-lines')out=[...new Set(input.split(/\r?\n/))].join('\n');else if(id==='sort-lines')out=input.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join('\n');else if(id==='find-replace'){const f=need('find').value;if(!f)throw new Error('Find text cannot be empty.');out=input.split(f).join(need('replace').value)}else if(id==='slug-generator')out=slug(input);else if(id==='content-summarizer')out=simpleSummary(input);else if(id==='content-shortener'){const words=input.trim()?input.trim().split(/\s+/):[];out=words.slice(0,Math.max(20,Math.ceil(words.length*.55))).join(' ')+(words.length>20?' ...':'')}else if(id==='article-outline')out='1. Introduction\n2. Background\n3. Main argument\n4. Evidence and examples\n5. Practical implications\n6. Limitations\n7. Conclusion\n\nTopic: '+input;else if(id==='essay-outline')out='Introduction\n- Context\n- Thesis\n\nBody\n- Argument 1\n- Argument 2\n- Counterargument\n- Evidence\n\nConclusion\n- Findings\n- Implications\n\nTopic: '+input;else if(id==='business-name-generator'){const q=input.trim()||'Business';out=['NovaForge','BrightPeak','NexaWorks','PrimeNest','BlueOrbit','Veridian Labs'].map(x=>x+' '+q).join('\n')}else if(id==='blog-post-ideas'){const q=input.trim()||'your topic';out=['Beginner guide to '+q,'Common mistakes in '+q,'Practical checklist for '+q,'How to improve results with '+q,'What experts wish beginners knew about '+q].join('\n')}else if(id==='lorem-ipsum-generator'){const n=Math.max(1,Math.min(20,Number(need('count').value)||3));const p='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer facilisis sapien at posuere volutpat. Donec posuere, lectus a luctus feugiat, justo libero suscipit arcu, vitae gravida risus sem sed erat.';out=Array.from({length:n},()=>p).join('\n\n')}else throw new Error('Unknown writing tool.');setResult('<pre>'+esc(out)+'</pre><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="downloadResult">Download result</button></div>','ok');need('downloadResult').onclick=()=>downloadText(out,t.id+'.txt')}catch(e){fail(e)}}

function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],n=text[i+1];if(ch==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(ch==='"'){quoted=!quoted;continue}if(ch===','&&!quoted){row.push(cell);cell='';continue}if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];continue}cell+=ch}if(cell!==''||row.length){row.push(cell);if(row.some(v=>v!==''))rows.push(row)}if(quoted)throw new Error('CSV contains an unclosed quoted field.');return rows}
function csvString(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function objToXml(v,name='root'){if(v===null)return '<'+name+'/>';if(Array.isArray(v))return '<'+name+'>'+v.map(x=>objToXml(x,'item')).join('')+'</'+name+'>';if(v&&typeof v==='object')return '<'+name+'>'+Object.entries(v).map(([k,x])=>objToXml(x,k.replace(/[^\w-]/g,'_')||'item')).join('')+'</'+name+'>';return '<'+name+'>'+esc(String(v))+'</'+name+'>'}
function xmlToObj(el){if(!el.children.length)return el.textContent;const o={};[...el.children].forEach(c=>{const v=xmlToObj(c);o[c.tagName]===undefined?o[c.tagName]=v:o[c.tagName]=[].concat(o[c.tagName],v)});return o}

async function runFile(t){try{const id=t.id,text=await getTextInput();if(id==='csv-to-json'){const rows=parseCsv(text),head=rows.shift()||[];if(!head.length)throw new Error('CSV is empty.');const out=rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])));offer(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),'converted.json','CSV converted to JSON.','<pre>'+esc(JSON.stringify(out,null,2))+'</pre>');return}

if(id==='password-generator'){const len=Math.max(4,Math.min(128,Number(need('length').value)||20)),count=Math.max(1,Math.min(20,Number(need('count').value)||5)),chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-+',buf=new Uint32Array(len*count);crypto.getRandomValues(buf);const rows=[];for(let n=0;n<count;n++){let s='';for(let i=0;i<len;i++)s+=chars[buf[n*len+i]%chars.length];rows.push(s)}showDownloadResult(rows.join('\n'),'passwords.txt');return}
if(id==='meme-maker'){const img=await loadImage(needFile()),[c,ctx]=canvasFor(img);ctx.drawImage(img,0,0);const f=Math.max(18,Math.round(c.width/10));ctx.font='900 '+f+'px Impact,Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.lineWidth=Math.max(3,f/10);ctx.strokeStyle='#000';ctx.fillStyle='#fff';const lines=[[need('top').value,10],[need('bottom').value,Math.max(0,c.height-f-12)]];for(const [txt,y] of lines){ctx.strokeText(String(txt).toUpperCase(),c.width/2,y,c.width-20);ctx.fillText(String(txt).toUpperCase(),c.width/2,y,c.width-20)}offer(await blobCanvas(c,'image/jpeg',.92),'meme.jpg','Meme created successfully.','<img class="preview" src="'+esc(c.toDataURL('image/jpeg',.8))+'" alt="Meme preview">');return}
if(id==='gradient-generator'){const c1=need('c1').value,c2=need('c2').value,a=Number(need('angle').value)||120,out='linear-gradient('+a+'deg, '+c1+', '+c2+')';setResult('<pre>'+esc(out)+'</pre><div style="margin-top:12px;height:180px;border-radius:16px;background:'+esc(out)+'"></div>','ok');return}
throw new Error('Unknown utility tool.')}catch(e){fail(e)}}

function openWorkspace(t){const b=need('run');b.onclick=async()=>{b.disabled=true;$('#out').classList.remove('hidden');setResult('<div class="muted">Processing...</div>','ok');try{if(t.cat==='PDF')await runPdf(t);else if(t.cat==='Image')await runImage(t);else if(t.cat==='Write')runWrite(t);else if(t.cat==='File')await runFile(t);else await runOther(t)}catch(e){fail(e)}finally{b.disabled=false}};need('reset').onclick=()=>render()}
async function runPdf(t){try{if(t.id==='create-pdf'){const text=need('text').value.trim();if(!text)throw new Error('Enter text first.');offer(makeTextPdf(text),'document.pdf','PDF created successfully.');return}if(t.id==='images-to-pdf'){const fs=needFiles(),items=[];for(const f of fs){const img=await loadImage(f),[c,ctx]=canvasFor(img);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);items.push({data:c.toDataURL('image/jpeg',.92),w:c.width,h:c.height})}offer(jpegPdf(items),'images.pdf',items.length+' image(s) added to PDF.');return}throw new Error('Unknown PDF tool.')}catch(e){fail(e)}}
function reminderKey(){return 'smartToolsHub.reminders.v2'}
function loadReminders(){try{const raw=JSON.parse(localStorage.getItem(reminderKey())||'[]');return Array.isArray(raw)?raw.filter(r=>r&&r.id&&r.when):[]}catch{return[]}}
function saveReminders(a){localStorage.setItem(reminderKey(),JSON.stringify(a))}
function reminderView(){return '<section class="workspace"><div class="ws-head"><div><div class="eyebrow">⭐ Reminder dashboard</div><h1>30-Day Multi-Task Reminder Suite</h1><div class="desc">Add up to 12 reminders within the next 30 days. Tasks persist after reload and provide direct WhatsApp, SMS, email and browser-alert actions.</div></div><span class="btn gold"><span id="taskCount">0</span>/12</span></div><div class="panel"><div class="fields"><div class="field"><label>Task title</label><input id="rtTitle" placeholder="Pay utility bill"></div><div class="field"><label>Date</label><input id="rtDate" type="date"></div><div class="field"><label>Time</label><input id="rtTime" type="time" value="09:00"></div><div class="field"><label>Phone</label><input id="rtPhone" inputmode="tel" placeholder="923001234567"></div><div class="field"><label>Email</label><input id="rtEmail" type="email" placeholder="name@example.com"></div><div class="field full"><label>Message</label><textarea id="rtMessage" placeholder="What should the reminder say?"></textarea></div></div><div class="toolbar" style="margin-top:16px"><button class="btn gold" id="addReminder">Add task</button><button class="btn" id="enableNotify">Enable browser alerts</button><button class="btn danger" id="clearReminders">Clear all</button></div><div id="reminderStatus" class="notice" style="margin-top:14px">Reminder checks run while this page is open.</div><div id="tasks"></div></div></section>'}
function isoLocalDate(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function setupReminder(){const today=new Date();const d=new Date(today);d.setDate(d.getDate()+1);need('rtDate').min=isoLocalDate(today);need('rtDate').max=isoLocalDate(new Date(today.getTime()+30*86400000));if(!need('rtDate').value)need('rtDate').value=isoLocalDate(d);renderTasks();need('addReminder').onclick=addReminder;need('clearReminders').onclick=()=>{if(confirm('Clear all reminders?')){saveReminders([]);renderTasks();toast('All reminders cleared.')}};need('enableNotify').onclick=async()=>{if(!('Notification' in window)){toast('Browser notifications are not supported.');return}try{const p=await Notification.requestPermission();toast('Notification permission: '+p)}catch{toast('Notification permission could not be requested.')}}}
function addReminder(){const a=loadReminders();if(a.length>=12){toast('Maximum 12 tasks reached.');return}const title=need('rtTitle').value.trim(),date=need('rtDate').value,time=need('rtTime').value||'09:00',phone=need('rtPhone').value.trim(),email=need('rtEmail').value.trim(),message=need('rtMessage').value.trim();if(!title||!date){toast('Enter a title and date.');return}const when=new Date(date+'T'+time);const now=Date.now(),max=now+30*86400000;if(Number.isNaN(when.getTime())||when.getTime()<=now){toast('Choose a future date and time.');return}if(when.getTime()>max){toast('Reminder must be within 30 days.');return}if(phone && !/^[+0-9][0-9\s().-]{6,}$/.test(phone))return toast('Enter a valid phone number.');if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email address.');a.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title,message,phone,email,when:when.getTime(),notified:false,created:Date.now()});saveReminders(a);need('rtTitle').value='';need('rtMessage').value='';need('rtPhone').value='';need('rtEmail').value='';renderTasks();toast('Reminder saved.')}
function statusFor(t){const delta=t.when-Date.now();return delta<0?'overdue':'upcoming'}
function renderTasks(){const a=loadReminders().sort((x,y)=>x.when-y.when),root=$('#tasks');if(!root)return;$('#taskCount').textContent=a.length;$('#reminderStatus').textContent=a.length?('Next reminder: '+new Date(a[0].when).toLocaleString()):'No reminders scheduled yet. Reminder checks run while this page is open.';root.innerHTML=a.length?a.map(t=>{const st=statusFor(t),phone=String(t.phone||'').replace(/[^0-9+]/g,''),wa=phone?'https://wa.me/'+phone.replace(/^\+/,'')+'?text='+encodeURIComponent(t.message||t.title):'',sms=phone?'sms:'+encodeURIComponent(phone)+'?body='+encodeURIComponent(t.message||t.title):'',mail=t.email?'mailto:'+encodeURIComponent(t.email)+'?subject='+encodeURIComponent(t.title)+'&body='+encodeURIComponent(t.message||t.title):'';return '<div class="task '+(st==='overdue'?'overdue':'')+'"><div class="task-top"><div><div class="task-title">'+esc(t.title)+'</div><div class="small muted">'+esc(new Date(t.when).toLocaleString())+'</div></div><span class="badge '+st+'">'+st+'</span></div><div style="margin-top:8px">'+esc(t.message||'No message')+'</div><div class="links">'+(wa?'<a href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+(sms?'<a href="'+esc(sms)+'">SMS</a>':'')+(mail?'<a href="'+esc(mail)+'">Email</a>':'')+'<button data-alert="'+esc(t.id)+'">Browser Alert</button><button data-done="'+esc(t.id)+'">Mark '+(t.notified?'Pending':'Done')+'</button><button class="btn danger" data-del="'+esc(t.id)+'">Delete</button></div></div>'}).join(''):'<div class="notice">No scheduled reminders.</div>';root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{saveReminders(loadReminders().filter(t=>t.id!==b.dataset.del));renderTasks()});root.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>{const t=loadReminders().find(x=>x.id===b.dataset.alert);if(t)alert(t.title+'\n\n'+(t.message||'')+'\n\n'+new Date(t.when).toLocaleString())});root.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const a=loadReminders(),t=a.find(x=>x.id===b.dataset.done);if(t){t.notified=!t.notified;saveReminders(a);renderTasks()}})}
function checkReminders(){const a=loadReminders(),now=Date.now();let changed=false;for(const t of a){if(!t.notified&&t.when<=now){t.notified=true;changed=true;if('Notification' in window&&Notification.permission==='granted'){try{new Notification(t.title,{body:t.message||'Reminder due now.'})}catch{}}}}if(changed)saveReminders(a);renderTasks()}
setInterval(checkReminders,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});window.addEventListener('focus',checkReminders);
function bindSearch(input,container){if(!input||!container)return;input.oninput=()=>{const q=slug(input.value);container.querySelectorAll('.tool').forEach(c=>{const ok=!q||slug(c.querySelector('h3').textContent).includes(q);c.classList.toggle('hide',!ok)})}}
function setActiveNav(key){document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===key))}
function render(){const h=location.hash||'#home',app=$('#app');if(h==='#home'){setActiveNav('home');app.innerHTML=home();bindSearch($('#homeSearch'),$('#homeTools'));return}if(h==='#reminder'){setActiveNav('reminder');app.innerHTML=reminderView();setupReminder();checkReminders();return}if(h.startsWith('#cat:')){const cat=decodeURIComponent(h.slice(5));if(!CATS.includes(cat)){location.hash='#home';return}setActiveNav(cat);app.innerHTML=category(cat);bindSearch($('#catSearch'),$('#catTools'));return}if(h.startsWith('#tool:')){const t=BY_ID[decodeURIComponent(h.slice(6))];if(!t){location.hash='#home';return}setActiveNav(t.cat);app.innerHTML=workspace(t);openWorkspace(t);return}location.hash='#home'}
window.addEventListener('hashchange',render);window.addEventListener('load',render);window.addEventListener('error',e=>{if(e?.error?.message)toast('Error: '+e.error.message)});window.addEventListener('unhandledrejection',e=>{const m=e?.reason?.message||String(e?.reason||'Unexpected error');toast('Error: '+m)});
</script>
