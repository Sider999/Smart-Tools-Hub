function canvasFor(im,w=im.naturalWidth||im.width,h=im.naturalHeight||im.height){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return [c,c.getContext('2d')]}
function downloadBlob(blob,name){return new Promise(resolve=>{const root=$('#modalRoot');root.innerHTML='<div class="ratingBackdrop"><div class="rating"><div class="eyebrow">Download confirmation</div><h2>Rate this tool</h2><p class="muted">Choose a star before saving <b>'+esc(name)+'</b>.</p><div class="stars">'+[1,2,3,4,5].map(i=>'<button class="star" data-star="'+i+'">★</button>').join('')+'</div><div class="toolbar" style="justify-content:center"><button class="btn ghost" id="cancelDownload">Cancel</button><button class="btn gold" id="saveDownload" disabled>Save file</button></div></div></div>';let rating=0;root.querySelectorAll('.star').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.star);root.querySelectorAll('.star').forEach(x=>x.classList.toggle('active',Number(x.dataset.star)<=rating));$('#saveDownload').disabled=false});$('#cancelDownload').onclick=()=>{root.innerHTML='';resolve(false)};$('#saveDownload').onclick=()=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);root.innerHTML='';resolve(true)}})}

function pdfEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/\r?\n/g,' ')}
function makeTextPdf(text){
  const lines=String(text).split(/\r?\n/), pageLines=[]; let cur=[], max=62;
  for(const line of lines){const parts=line.match(/.{1,95}(?:\s+|$)/g)||[''];for(const p of parts){if(cur.length>=max){pageLines.push(cur);cur=[]}cur.push(p.trim())}}
  if(cur.length||!pageLines.length)pageLines.push(cur);
  const objs=[]; const add=x=>{objs.push(x);return objs.length}; const pagesId=add(''); const fontId=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'); const pageIds=[];
  for(const page of pageLines){let stream='BT /F1 11 Tf 50 790 Td 0 -15 Td ';let first=true;for(const ln of page){if(!first)stream+='0 -15 Td ';stream+='('+pdfEscape(ln)+') Tj ';first=false}stream+='ET';const contentId=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');pageIds.push(add(''));
    objs[pageIds[pageIds.length-1]-1]='<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 '+fontId+' 0 R >> >> /Contents '+contentId+' 0 R >>'; }
  objs[pagesId-1]='<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ') +'] /Count '+pageIds.length+' >>';
  const catalogId=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');return buildPdf(objs,catalogId)
}
function bytesToLatin1(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return s}
function asciiBytes(s){const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a}
function concatBytes(parts){let n=0;for(const p of parts)n+=p.length;const out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function buildPdf(objects,rootId){let parts=[asciiBytes('%PDF-1.4\n')],offsets=[0],total=parts[0].length;for(let i=0;i<objects.length;i++){offsets[i+1]=total;const bytes=objects[i] instanceof Uint8Array?objects[i]:asciiBytes(String(objects[i]));const head=asciiBytes((i+1)+' 0 obj\n'),tail=asciiBytes('\nendobj\n');parts.push(head,bytes,tail);total+=head.length+bytes.length+tail.length}const xrefOffset=total;let x='xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<offsets.length;i++)x+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';x+='trailer\n<< /Size '+(objects.length+1)+' /Root '+rootId+' 0 R >>\nstartxref\n'+xrefOffset+'\n%%EOF';parts.push(asciiBytes(x));return new Blob([concatBytes(parts)],{type:'application/pdf'})}
function jpegPdf(images){const objs=[],add=x=>(objs.push(x),objs.length),pagesId=add(''),pageIds=[];for(let i=0;i<images.length;i++){const b64=images[i].data.split(',')[1],bin=atob(b64),bytes=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);const imgHeader='<< /Type /XObject /Subtype /Image /Width '+images[i].w+' /Height '+images[i].h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n',imgId=add(concatBytes([asciiBytes(imgHeader),bytes,asciiBytes('\nendstream')]));const content='q 595 0 0 842 0 0 cm /Im'+(i+1)+' Do Q',cId=add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream'),pId=add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im'+(i+1)+' '+imgId+' 0 R >> >> /Contents '+cId+' 0 R >>');pageIds.push(pId)}objs[pagesId-1]='<< /Type /Pages /Kids ['+pageIds.map(x=>x+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>';return buildPdf(objs,add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>'))}

function transformImage(id,im){let [c,ctx]=canvasFor(im),type='image/png',name=id+'.png';
 if(id==='resize-image'){c.width=Math.max(1,Number(requireEl('w').value));c.height=Math.max(1,Number(requireEl('h').value));ctx.drawImage(im,0,0,c.width,c.height);return [c,type,name]}
 ctx.drawImage(im,0,0);
 if(id==='compress-image'){type='image/jpeg';name='compressed.jpg';return [c,type,name]}
 if(id==='crop-image'){const x=Math.max(0,Number(requireEl('x').value)||0),y=Math.max(0,Number(requireEl('y').value)||0),w=Math.min(im.width-x,Math.max(1,Number(requireEl('w').value)||500)),h=Math.min(im.height-y,Math.max(1,Number(requireEl('h').value)||500));[c,ctx]=canvasFor(im,w,h);ctx.drawImage(im,x,y,w,h,0,0,w,h);return[c,type,'cropped.png']}
 if(id==='rotate-image'){const d=Number(requireEl('deg').value);const swap=d===90||d===270;[c,ctx]=canvasFor(im,swap?im.height:im.width,swap?im.width:im.height);ctx.translate(c.width/2,c.height/2);ctx.rotate(d*Math.PI/180);ctx.drawImage(im,-im.width/2,-im.height/2);return[c,type,'rotated.png']}
 if(id==='flip-image'){const f=requireEl('dir').value;ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(f.includes('x')?c.width:0,f.includes('y')?c.height:0);ctx.scale(f.includes('x')?-1:1,f.includes('y')?-1:1);ctx.drawImage(im,0,0);ctx.restore();return[c,type,'flipped.png']}
 if(id==='grayscale-image'){ctx.clearRect(0,0,c.width,c.height);ctx.filter='grayscale(1)';ctx.drawImage(im,0,0);return[c,type,'grayscale.png']}
 if(id==='sepia-image'){ctx.clearRect(0,0,c.width,c.height);ctx.filter='sepia(1)';ctx.drawImage(im,0,0);return[c,type,'sepia.png']}
 if(id==='invert-image'){ctx.clearRect(0,0,c.width,c.height);ctx.filter='invert(1)';ctx.drawImage(im,0,0);return[c,type,'inverted.png']}
 if(id==='pixelate-image'){const s=Math.max(2,Number(requireEl('pixel').value)||16),small=document.createElement('canvas');small.width=Math.max(1,Math.ceil(im.width/s));small.height=Math.max(1,Math.ceil(im.height/s));small.getContext('2d').drawImage(im,0,0,small.width,small.height);ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,c.width,c.height);return[c,type,'pixelated.png']}
 if(id==='add-border-to-image'){const b=Math.max(1,Number(requireEl('border').value)||20);[c,ctx]=canvasFor(im,im.width+2*b,im.height+2*b);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,b,b);return[c,type,'bordered.png']}
 if(id==='add-text-to-image'){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0);ctx.font='bold 48px Arial';ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#000';ctx.fillStyle='#fff';const txt=requireEl('overlay').value;ctx.strokeText(txt,c.width/2,64);ctx.fillText(txt,c.width/2,64);return[c,type,'text-overlay.png']}
 if(id==='round-image'){const side=Math.min(im.width,im.height);[c,ctx]=canvasFor(im,side,side);ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.beginPath();ctx.arc(side/2,side/2,side/2,0,Math.PI*2);ctx.clip();ctx.drawImage(im,(side-im.width)/2,(side-im.height)/2);ctx.restore();return[c,type,'round.png']}
 const map={'jpg-to-png':['image/png','converted.png'],'png-to-jpg':['image/jpeg','converted.jpg'],'webp-to-png':['image/png','converted.png'],'png-to-webp':['image/webp','converted.webp'],'jpg-to-webp':['image/webp','converted.webp'],'webp-to-jpg':['image/jpeg','converted.jpg']}; if(map[id])return[c,map[id][0],map[id][1]];
 return [c,type,name]
}
async function runImage(t){try{const id=t.id;if(id==='combine-images'||id==='collage-maker'){const fs=requireFiles(),imgs=await Promise.all(fs.map(loadImage)),cols=Math.max(1,Math.min(8,Number(requireEl('cols').value)||2)),cellW=Math.max(...imgs.map(i=>i.width)),cellH=Math.max(...imgs.map(i=>i.height)),rows=Math.ceil(imgs.length/cols),c=document.createElement('canvas');c.width=cellW*cols;c.height=cellH*rows;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);imgs.forEach((im,i)=>ctx.drawImage(im,(i%cols)*cellW,Math.floor(i/cols)*cellH));offerDownload(await blobCanvas(c,'image/png'),'combined.png','Image set combined successfully.');return}

 const fs=requireFiles(),im=await loadImage(fs[0]);const [c,type,name]=transformImage(id,im),quality=id==='compress-image'?Math.min(1,Math.max(.1,Number(requireEl('quality').value)||.7)):.92;const outBlob=await blobCanvas(c,type,quality),preview=URL.createObjectURL(outBlob);offerDownload(outBlob,name,'Image processed successfully.','<img style="max-width:100%;margin-top:12px;border-radius:12px" src="'+preview+'" alt="Processed image">');setTimeout(()=>URL.revokeObjectURL(preview),60000) }catch(e){fail(e)}}

function titleCase(s){return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}
function simpleSummary(s){const sentences=s.match(/[^.!?]+[.!?]+/g)||[s];return sentences.slice(0,3).join(' ').trim()}
function runWrite(t){try{const id=t.id,input=requireEl('text').value;let out='';if(id==='word-counter')out='Words: '+(input.trim()?input.trim().split(/\s+/).length:0);else if(id==='character-counter')out='Characters: '+input.length+'\nCharacters without spaces: '+input.replace(/\s/g,'').length;else if(id==='uppercase')out=input.toUpperCase();else if(id==='lowercase')out=input.toLowerCase();else if(id==='title-case')out=titleCase(input);else if(id==='sentence-case')out=input.replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());else if(id==='clean-whitespace')out=input.replace(/\s+/g,' ').trim();else if(id==='remove-duplicate-lines')out=[...new Set(input.split(/\r?\n/))].join('\n');else if(id==='sort-lines')out=input.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join('\n');else if(id==='find-replace')out=input.split(requireEl('find').value).join(requireEl('replace').value);else if(id==='slug-generator')out=slug(input);else if(id==='content-summarizer')out=simpleSummary(input);else if(id==='content-shortener'){const words=input.trim().split(/\s+/);out=words.slice(0,Math.max(20,Math.ceil(words.length*.55))).join(' ')+(words.length>20?' …':'')}else if(id==='article-outline')out='1. Introduction\n2. Background\n3. Key arguments\n4. Evidence and examples\n5. Practical implications\n6. Limitations\n7. Conclusion\n\nTopic: '+input;else if(id==='essay-outline')out='Introduction\n- Context\n- Thesis\n\nBody\n- Argument 1\n- Argument 2\n- Counterargument\n- Evidence\n\nConclusion\n- Findings\n- Implications\n\nTopic: '+input;else if(id==='business-name-generator')out=['NovaForge','BrightPeak','NexaWorks','PrimeNest','BlueOrbit','Veridian Labs'].map(x=>x+' '+input.trim()).join('\n');else if(id==='blog-post-ideas')out=['Beginner guide to '+input,'Common mistakes in '+input,'A practical checklist for '+input,'How to improve results with '+input,'What experts wish beginners knew about '+input].join('\n');else if(id==='lorem-ipsum-generator'){const n=Math.max(1,Math.min(20,Number(requireEl('count').value)||3)),p='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer facilisis sapien at posuere volutpat.';out=Array.from({length:n},()=>p).join('\n\n')}else throw new Error('Unknown writing tool.');setResult('<pre>'+esc(out)+'</pre><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="downloadResult">Download result</button></div>','ok');$('#downloadResult').onclick=()=>downloadText(out,t.id+'.txt');}catch(e){fail(e)}}

function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;continue}if(ch==='"'){quoted=!quoted;continue}if(ch===','&&!quoted){row.push(cell);cell='';continue}if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];continue}cell+=ch}if(cell!==''||row.length){row.push(cell);if(row.some(v=>v!==''))rows.push(row)}return rows}
function csvString(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function objToXml(v,name='root'){if(Array.isArray(v))return '<'+name+'>'+v.map(x=>objToXml(x,'item')).join('')+'</'+name+'>';if(v&&typeof v==='object')return '<'+name+'>'+Object.entries(v).map(([k,x])=>objToXml(x,k.replace(/[^\w-]/g,'_')||'item')).join('')+'</'+name+'>';return '<'+name+'>'+esc(String(v))+'</'+name+'>'}
function xmlToObj(el){if(!el.children.length)return el.textContent;const o={};[...el.children].forEach(c=>{const v=xmlToObj(c);o[c.tagName]===undefined?o[c.tagName]=v:o[c.tagName]=[].concat(o[c.tagName],v)});return o}

function reminderSchedule(days,time){const now=new Date(),d=new Date(now);d.setDate(d.getDate()+days);const [hh,mm]=String(time||'09:00').split(':').map(Number);d.setHours(hh||0,mm||0,0,0);return d.getTime()}
function reminderLinks(t){const phone=String(t.phone||'').replace(/[^0-9+]/g,''),msg=t.message||t.title;return {wa:phone?'https://wa.me/'+phone.replace(/^\+/,'')+'?text='+encodeURIComponent(msg):'#',sms:phone?'sms:'+phone+'?body='+encodeURIComponent(msg):'#',mail:t.email?'mailto:'+encodeURIComponent(t.email)+'?subject='+encodeURIComponent(t.title)+'&body='+encodeURIComponent(msg):'#'}}
function renderTasks(){const a=tasks().sort((x,y)=>x.when-y.when),root=$('#tasks');if(!root)return;$('#taskCount').textContent=a.length;root.innerHTML=a.length?a.map(t=>{const l=reminderLinks(t),due=t.when<=Date.now(),done=!!t.done,cls=done?' done':due?' overdue':'',status=done?'Completed':due?'Due now / overdue':'Upcoming';return '<div class="task'+cls+'"><div class="taskTop"><div><b>'+esc(t.title)+'</b><div class="small muted">'+esc(new Date(t.when).toLocaleString())+'</div></div><span class="badge '+(done?'upcoming':due?'overdue':'upcoming')+'">'+status+'</span></div><div style="margin-top:8px">'+esc(t.message||'')+'</div><div class="links"><a href="'+l.wa+'" target="_blank" rel="noopener">WhatsApp</a><a href="'+l.sms+'">SMS</a><a href="'+l.mail+'">Email</a><button type="button" data-alert="'+esc(t.id)+'">Browser Alert</button><button type="button" data-done="'+esc(t.id)+'">'+(done?'Mark pending':'Mark done')+'</button><button type="button" data-del="'+esc(t.id)+'">Delete</button></div></div>'}).join(''):'<div class="notice">No scheduled tasks yet.</div>';root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{saveTasks(tasks().filter(t=>t.id!==b.dataset.del));renderTasks()});root.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const a=tasks();const t=a.find(x=>x.id===b.dataset.done);if(t){t.done=!t.done;saveTasks(a);renderTasks()}});root.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>{const t=tasks().find(x=>x.id===b.dataset.alert);if(t)sendReminderAlert(t,false)})}
async function sendReminderAlert(t,system=false){const body=(t.message||t.title)+'\n\nScheduled: '+new Date(t.when).toLocaleString();if(system&&'Notification' in window&&Notification.permission==='granted'){new Notification(t.title,{body:t.message||'Reminder due now.'})}else{alert(t.title+'\n\n'+body)}}
async function checkReminders(){const a=tasks(),now=Date.now();let changed=false;for(const t of a){if(!t.done&&t.when<=now&&!t.notified){await sendReminderAlert(t,true);t.notified=true;changed=true}}if(changed)saveTasks(a);renderTasks()}
function setupReminder(){renderTasks();const time=$('#rtTime');if(time&&!time.value)time.value='09:00';$('#addReminder').onclick=()=>{const a=tasks();if(a.length>=12)return toast('Maximum 12 tasks reached.');const title=$('#rtTitle').value.trim(),days=Number($('#rtDays').value),time=$('#rtTime').value||'09:00',phone=$('#rtPhone').value.trim(),email=$('#rtEmail').value.trim();if(!title||!Number.isInteger(days)||days<1||days>30)return toast('Enter a title and a whole number from 1 to 30 days.');if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email address.');const when=reminderSchedule(days,time);const minFuture=Date.now()+60000;if(when<=Date.now())return toast('Choose a future reminder time.');a.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),title,message:$('#rtMessage').value.trim(),phone,email,when,notified:false,done:false});saveTasks(a);['rtTitle','rtMessage','rtPhone','rtEmail'].forEach(id=>$('#'+id).value='');$('#rtDays').value='1';$('#rtTime').value='09:00';renderTasks();toast('Reminder added successfully.');};$('#clearReminders').onclick=()=>{if(confirm('Clear all reminders?')){saveTasks([]);renderTasks()}};$('#notify').onclick=async()=>{if(!('Notification' in window))return toast('Browser notifications are not supported here.');const p=await Notification.requestPermission();toast('Notification permission: '+p);if(p==='granted')checkReminders()};window.__reminderTimer=setInterval(checkReminders,30000);window.addEventListener('focus',checkReminders,{once:false})}

function bindWorkspace(t){$('#run').onclick=async()=>{const b=$('#run');b.disabled=true;$('#out').classList.remove('hidden');try{if(t.cat==='PDF')await runPdf(t);else if(t.cat==='Image')await runImage(t);else if(t.cat==='Write')runWrite(t);else if(t.cat==='File')await runFile(t);else runOther(t)}finally{b.disabled=false}};$('#reset').onclick=()=>render()}
function bindSearch(inp,container){if(!inp||!container)return;inp.oninput=()=>{const q=slug(inp.value);container.querySelectorAll('.tool').forEach(c=>c.classList.toggle('hide',q&&!slug(c.querySelector('h3').textContent).includes(q)))}}
function render(){const h=location.hash||'#home',app=$('#app');if(h==='#home'){app.innerHTML=home();bindSearch($('#homeSearch'),$('#homeTools'));return}if(h==='#reminder'){app.innerHTML=reminderView();setupReminder();return}if(h.startsWith('#cat:')){const cat=decodeURIComponent(h.slice(5));if(!ICON[cat])return location.hash='#home';app.innerHTML=category(cat);bindSearch($('#catSearch'),$('#catTools'));return}if(h.startsWith('#tool:')){const t=byId[decodeURIComponent(h.slice(6))];if(!t)return location.hash='#home';app.innerHTML=workspace(t);bindWorkspace(t);return}location.hash='#home'}
window.addEventListener('hashchange',render);window.addEventListener('load',render);
window.addEventListener('error',e=>{const m=e?.error?.message||e?.message;if(m)toast('Tool error: '+m)});
window.addEventListener('unhandledrejection',e=>{const m=e?.reason?.message||String(e?.reason||'Unhandled error');toast('Tool error: '+m)});
</script>
